<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Log Viewer</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="main-container">
        <div class="toolbar">
            <div class="toolbar-left">
                <button id="startBtn" class="btn btn-primary">
                    <i class="fas fa-play"></i> Start
                </button>
                <button id="stopBtn" class="btn btn-secondary">
                    <i class="fas fa-stop"></i> Stop
                </button>
                <button id="clearBtn" class="btn btn-danger">
                    <i class="fas fa-trash"></i> Clear
                </button>
            </div>
            
            <div class="toolbar-center">
                <div class="search-container">
                    <i class="fas fa-search search-icon"></i>
                    <input type="text" id="searchInput" placeholder="Search messages..." class="search-input">
                </div>
                <div class="lines-container">
                    <label for="linesInput">Lines:</label>
                    <input type="number" id="linesInput" value="200" min="1" max="10000" class="lines-input">
                </div>
            </div>
            
            <div class="toolbar-right">
                <div class="filter-container">
                    <label>Level Filter:</label>
                    <div class="filter-buttons">
                        <button id="filterAll" class="btn btn-small btn-filter active">All</button>
                        <button id="filterNone" class="btn btn-small btn-filter">None</button>
                        <button id="filterInfo" class="btn btn-small btn-filter level-info">INFO</button>
                        <button id="filterWarn" class="btn btn-small btn-filter level-warn">WARN</button>
                        <button id="filterError" class="btn btn-small btn-filter level-error">ERROR</button>
                        <button id="filterDebug" class="btn btn-small btn-filter level-debug">DEBUG</button>
                    </div>
                </div>
            </div>
        </div>
        
        <div class="content-container">
            <div class="log-container">
                <table id="logTable" class="log-table">
                    <thead>
                        <tr>
                            <th class="col-time">Time</th>
                            <th class="col-level">Level</th>
                            <th class="col-code">Code</th>
                            <th class="col-message">Message</th>
                        </tr>
                    </thead>
                    <tbody id="logTableBody">
                        <!-- Logs will be populated here -->
                    </tbody>
                </table>
            </div>
            
            <div id="detailsPanel" class="details-panel">
                <div class="details-header">
                    <h3>Log Details</h3>
                    <button id="closePanelBtn" class="btn btn-small">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="details-content" id="detailsContent">
                    <p>Click on a log entry to view details</p>
                </div>
            </div>
        </div>
    </div>
    
    <script>
        let autoRefresh = false;
        let refreshInterval = null;
        let logs = [];
        let filteredLogs = [];
        let activeFilters = new Set(['INFO', 'WARN', 'ERROR', 'DEBUG', 'NOTICE']);
        let currentSearch = '';
        let currentLines = 200;
        
        // Initialize
        document.addEventListener('DOMContentLoaded', function() {
            loadLogs();
            setupEventListeners();
        });
        
        function setupEventListeners() {
            // Control buttons
            document.getElementById('startBtn').addEventListener('click', startAutoRefresh);
            document.getElementById('stopBtn').addEventListener('click', stopAutoRefresh);
            document.getElementById('clearBtn').addEventListener('click', clearLogs);
            
            // Search and lines
            document.getElementById('searchInput').addEventListener('input', handleSearch);
            document.getElementById('linesInput').addEventListener('change', handleLinesChange);
            
            // Filter buttons
            document.getElementById('filterAll').addEventListener('click', () => setAllFilters(true));
            document.getElementById('filterNone').addEventListener('click', () => setAllFilters(false));
            document.getElementById('filterInfo').addEventListener('click', () => toggleFilter('INFO'));
            document.getElementById('filterWarn').addEventListener('click', () => toggleFilter('WARN'));
            document.getElementById('filterError').addEventListener('click', () => toggleFilter('ERROR'));
            document.getElementById('filterDebug').addEventListener('click', () => toggleFilter('DEBUG'));
            
            // Details panel
            document.getElementById('closePanelBtn').addEventListener('click', closeDetailsPanel);
        }
        
        function startAutoRefresh() {
            if (!autoRefresh) {
                autoRefresh = true;
                document.getElementById('startBtn').classList.add('active');
                document.getElementById('stopBtn').classList.remove('active');
                refreshInterval = setInterval(loadLogs, 2000);
            }
        }
        
        function stopAutoRefresh() {
            if (autoRefresh) {
                autoRefresh = false;
                document.getElementById('startBtn').classList.remove('active');
                document.getElementById('stopBtn').classList.add('active');
                if (refreshInterval) {
                    clearInterval(refreshInterval);
                    refreshInterval = null;
                }
            }
        }
        
        function clearLogs() {
            logs = [];
            filteredLogs = [];
            renderLogs();
            closeDetailsPanel();
        }
        
        function handleSearch() {
            currentSearch = document.getElementById('searchInput').value.toLowerCase();
            applyFilters();
        }
        
        function handleLinesChange() {
            currentLines = parseInt(document.getElementById('linesInput').value) || 200;
            loadLogs();
        }
        
        function setAllFilters(enabled) {
            if (enabled) {
                activeFilters = new Set(['INFO', 'WARN', 'ERROR', 'DEBUG', 'NOTICE']);
                document.getElementById('filterAll').classList.add('active');
                document.getElementById('filterNone').classList.remove('active');
                document.querySelectorAll('.btn-filter:not(#filterAll):not(#filterNone)').forEach(btn => {
                    btn.classList.add('active');
                });
            } else {
                activeFilters = new Set();
                document.getElementById('filterAll').classList.remove('active');
                document.getElementById('filterNone').classList.add('active');
                document.querySelectorAll('.btn-filter:not(#filterAll):not(#filterNone)').forEach(btn => {
                    btn.classList.remove('active');
                });
            }
            applyFilters();
        }
        
        function toggleFilter(level) {
            const btn = document.getElementById('filter' + level.charAt(0).toUpperCase() + level.slice(1).toLowerCase());
            if (activeFilters.has(level)) {
                activeFilters.delete(level);
                btn.classList.remove('active');
            } else {
                activeFilters.add(level);
                btn.classList.add('active');
            }
            
            // Update All/None buttons
            const allLevels = ['INFO', 'WARN', 'ERROR', 'DEBUG', 'NOTICE'];
            const allActive = allLevels.every(l => activeFilters.has(l));
            const noneActive = activeFilters.size === 0;
            
            document.getElementById('filterAll').classList.toggle('active', allActive);
            document.getElementById('filterNone').classList.toggle('active', noneActive);
            
            applyFilters();
        }
        
        function applyFilters() {
            filteredLogs = logs.filter(log => {
                const matchesLevel = activeFilters.size === 0 || activeFilters.has(log.level);
                const matchesSearch = !currentSearch || 
                    log.message.toLowerCase().includes(currentSearch) ||
                    log.json_part.toLowerCase().includes(currentSearch) ||
                    log.level.toLowerCase().includes(currentSearch);
                return matchesLevel && matchesSearch;
            });
            renderLogs();
        }
        
        function loadLogs() {
            const params = new URLSearchParams();
            if (currentSearch) params.append('search', currentSearch);
            if (currentLines !== 200) params.append('lines', currentLines);
            
            fetch('/logs?' + params.toString())
                .then(response => response.json())
                .then(data => {
                    logs = data || [];
                    applyFilters();
                })
                .catch(error => {
                    console.error('Error loading logs:', error);
                });
        }
        
        function renderLogs() {
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = '';
            
            filteredLogs.forEach((log, index) => {
                const row = document.createElement('tr');
                if (log.is_recent) {
                    row.classList.add('recent');
                }
                
                const timeCell = document.createElement('td');
                timeCell.className = 'col-time';
                timeCell.textContent = formatTime(log.timestamp);
                
                const levelCell = document.createElement('td');
                levelCell.className = 'col-level';
                levelCell.innerHTML = `<span class="level level-${log.level.toLowerCase()}">${log.level}</span>`;
                
                const codeCell = document.createElement('td');
                codeCell.className = 'col-code';
                codeCell.textContent = log.json_code || '';
                
                const messageCell = document.createElement('td');
                messageCell.className = 'col-message';
                messageCell.textContent = log.message;
                
                row.appendChild(timeCell);
                row.appendChild(levelCell);
                row.appendChild(codeCell);
                row.appendChild(messageCell);
                
                row.addEventListener('click', () => showLogDetails(log));
                tbody.appendChild(row);
            });
        }
        
        function formatTime(timestamp) {
            const now = new Date();
            const logTime = new Date(timestamp);
            const today = new Date(now.getFullYear(), now.getMonth(), now.getDate());
            const logDate = new Date(logTime.getFullYear(), logTime.getMonth(), logTime.getDate());
            
            const timeStr = logTime.toLocaleTimeString('en-US', {
                hour12: false,
                hour: '2-digit',
                minute: '2-digit',
                second: '2-digit'
            });
            
            if (logDate.getTime() !== today.getTime()) {
                const dateStr = logTime.toLocaleDateString('en-US', {
                    month: '2-digit',
                    day: '2-digit'
                });
                return `${timeStr} (${dateStr})`;
            }
            
            return timeStr;
        }
        
        function showLogDetails(log) {
            const panel = document.getElementById('detailsPanel');
            const content = document.getElementById('detailsContent');
            
            let html = `
                <div class="detail-section">
                    <h4>Basic Information</h4>
                    <div class="detail-row">
                        <span class="detail-label">Timestamp:</span>
                        <span class="detail-value">${log.timestamp}</span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Level:</span>
                        <span class="detail-value"><span class="level level-${log.level.toLowerCase()}">${log.level}</span></span>
                    </div>
                    <div class="detail-row">
                        <span class="detail-label">Message:</span>
                        <span class="detail-value">${log.message}</span>
                    </div>
                </div>
            `;
            
            if (log.json_file || log.json_line || log.json_class || log.json_function) {
                html += `
                    <div class="detail-section">
                        <h4>Code Location</h4>
                        ${log.json_file ? `<div class="detail-row"><span class="detail-label">File:</span><span class="detail-value">${log.json_file}</span></div>` : ''}
                        ${log.json_line ? `<div class="detail-row"><span class="detail-label">Line:</span><span class="detail-value">${log.json_line}</span></div>` : ''}
                        ${log.json_class ? `<div class="detail-row"><span class="detail-label">Class:</span><span class="detail-value">${log.json_class}</span></div>` : ''}
                        ${log.json_function ? `<div class="detail-row"><span class="detail-label">Function:</span><span class="detail-value">${log.json_function}</span></div>` : ''}
                        ${log.json_code ? `<div class="detail-row"><span class="detail-label">Code:</span><span class="detail-value">${log.json_code}</span></div>` : ''}
                    </div>
                `;
            }
            
            if (log.json_request_uri || log.json_correlation_id) {
                html += `
                    <div class="detail-section">
                        <h4>Request Information</h4>
                        ${log.json_request_uri ? `<div class="detail-row"><span class="detail-label">URI:</span><span class="detail-value">${log.json_request_uri}</span></div>` : ''}
                        ${log.json_correlation_id ? `<div class="detail-row"><span class="detail-label">Correlation ID:</span><span class="detail-value">${log.json_correlation_id}</span></div>` : ''}
                    </div>
                `;
            }
            
            if (log.json_exception || log.json_exceptionMessage) {
                html += `
                    <div class="detail-section">
                        <h4>Exception Information</h4>
                        ${log.json_exceptionMessage ? `<div class="detail-row"><span class="detail-label">Message:</span><span class="detail-value">${log.json_exceptionMessage}</span></div>` : ''}
                        ${log.json_exception ? `<div class="detail-row"><span class="detail-label">Exception:</span><span class="detail-value"><pre>${log.json_exception}</pre></span></div>` : ''}
                    </div>
                `;
            }
            
            if (log.source_file) {
                html += `
                    <div class="detail-section">
                        <h4>Source</h4>
                        <div class="detail-row">
                            <span class="detail-label">File:</span>
                            <span class="detail-value">${log.source_file}</span>
                        </div>
                    </div>
                `;
            }
            
            if (log.json_part) {
                html += `
                    <div class="detail-section">
                        <h4>Raw JSON</h4>
                        <pre class="json-content">${log.json_part}</pre>
                    </div>
                `;
            }
            
            content.innerHTML = html;
            panel.classList.add('open');
        }
        
        function closeDetailsPanel() {
            document.getElementById('detailsPanel').classList.remove('open');
        }
    </script>
</body>
</html>
