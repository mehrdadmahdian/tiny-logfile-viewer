<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>HOAPI Log Viewer</title>
    <link rel="stylesheet" href="/static/styles.css">
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
</head>
<body>
    <div class="page-header">
        <h1><i class="fas fa-file-alt"></i> HOAPI Log Viewer <span id="logSource" class="log-source-inline">(Loading...)</span></h1>
    </div>
    
    <div class="app-container">
    <div class="main-container">
        <div class="toolbar">
            <div class="toolbar-left">
                <button id="toggleBtn" class="btn btn-primary" data-state="stopped">
                    <i class="fas fa-play"></i> Start
                </button>
                <button id="clearBtn" class="btn btn-secondary">
                    <i class="fas fa-trash"></i> Clear
                </button>
            </div>
            
            <div class="toolbar-center">
                <div class="search-container">
                    <input type="text" id="searchInput" placeholder="Search in logs..." class="search-input">
                    <i class="fas fa-search search-icon"></i>
                </div>
            </div>
            
            <div class="toolbar-right">
                <div class="filter-group">
                    <label for="linesInput">Lines:</label>
                    <input type="number" id="linesInput" class="filter-input" value="200" min="1" max="10000" placeholder="200">
                </div>

                <div class="filter-group">
                    <label>Levels:</label>
                    <button id="allBtn" class="filter-btn active" data-level="all">All</button>
                    <button id="noneBtn" class="filter-btn" data-level="none">None</button>
                    <button class="filter-btn" data-level="CRIT">CRIT</button>
                    <button class="filter-btn" data-level="ERROR">ERROR</button>
                    <button class="filter-btn" data-level="WARN">WARN</button>
                    <button class="filter-btn" data-level="INFO">INFO</button>
                    <button class="filter-btn" data-level="NOTICE">NOTICE</button>
                    <button class="filter-btn" data-level="DEBUG">DEBUG</button>
                </div>
            </div>
        </div>
        
        <div class="content-area">
            <div class="log-container">
                <div class="table-container">
                    <table id="logTable">
                        <thead>
                            <tr>
                                <th class="col-time">Time</th>
                                <th class="col-level">Level</th>
                                <th class="col-code">Code</th>
                                <th class="col-message">Message</th>
                                <th class="col-file">File</th>
                            </tr>
                        </thead>
                        <tbody id="logTableBody">
                            <!-- Dynamic content -->
                        </tbody>
                    </table>
                </div>
                
                <div class="loading" id="loading">
                    <i class="fas fa-spinner fa-spin"></i> Loading logs...
                </div>
                
                <div class="error-message" id="errorMessage">
                    <i class="fas fa-exclamation-triangle"></i> 
                    <div class="error-content">
                        <h4>Service Unavailable</h4>
                        <p>The log service is currently not responding. Please check if the service is running and try again.</p>
                        <div class="error-actions">
                            <button id="retryBtn" class="btn btn-primary btn-sm">
                                <i class="fas fa-redo"></i> Retry
                            </button>
                        </div>
                    </div>
                </div>
            </div>
        
            <div class="details-panel" id="detailsPanel">
                <div class="details-header">
                    <h3><i class="fas fa-info-circle"></i> Log Details</h3>
                    <button id="closePanelBtn" class="btn-close">
                        <i class="fas fa-times"></i>
                    </button>
                </div>
                <div class="details-content" id="detailsContent">
                    <p class="no-selection">Select a log entry to view details</p>
                </div>
            </div>
        </div>
    </div>

    <script>
        let isRunning = false;
        let refreshInterval;
        let selectedLevels = ['all'];
        let lastUpdate = new Date();
        let currentSearch = '';
        let currentLines = 200;
        let lastLogHash = '';
        let clearTimestamp = null;

        // Cookie helper functions
        function setCookie(name, value, days = 30) {
            const expires = new Date();
            expires.setTime(expires.getTime() + (days * 24 * 60 * 60 * 1000));
            document.cookie = `${name}=${encodeURIComponent(JSON.stringify(value))};expires=${expires.toUTCString()};path=/`;
        }

        function getCookie(name) {
            const nameEQ = name + "=";
            const ca = document.cookie.split(';');
            for(let i = 0; i < ca.length; i++) {
                let c = ca[i];
                while (c.charAt(0) === ' ') c = c.substring(1, c.length);
                if (c.indexOf(nameEQ) === 0) {
                    try {
                        return JSON.parse(decodeURIComponent(c.substring(nameEQ.length, c.length)));
                    } catch (e) {
                        return null;
                    }
                }
            }
            return null;
        }

        // Initialize on page load
        document.addEventListener('DOMContentLoaded', function() {
            loadLogSource();
            loadSavedFilters();
            initializeEventListeners();
            loadLogs();
            // Start in play mode by default after a short delay
            setTimeout(() => {
                if (!isRunning) {
                    toggleLogUpdates();
                }
            }, 1000);
        });

        function loadSavedFilters() {
            const savedFilters = getCookie('logLevelFilters');
            if (savedFilters && Array.isArray(savedFilters)) {
                selectedLevels = savedFilters;
                updateFilterButtons();
            }
        }

        function updateFilterButtons() {
            // Reset all buttons
            document.querySelectorAll('.filter-btn').forEach(btn => btn.classList.remove('active'));
            
            // Set active buttons based on selectedLevels
            if (selectedLevels.includes('all')) {
                document.getElementById('allBtn').classList.add('active');
            } else if (selectedLevels.length === 0) {
                document.getElementById('noneBtn').classList.add('active');
            } else {
                selectedLevels.forEach(level => {
                    const btn = document.querySelector(`.filter-btn[data-level="${level}"]`);
                    if (btn) {
                        btn.classList.add('active');
                    }
                });
            }
        }

        function initializeEventListeners() {
            // Toggle button
            document.getElementById('toggleBtn').addEventListener('click', function() {
                toggleLogUpdates();
            });

            // Clear button
            document.getElementById('clearBtn').addEventListener('click', function() {
                clearLogs();
            });

            // Search input
            document.getElementById('searchInput').addEventListener('input', function(e) {
                currentSearch = e.target.value;
                debounceSearch();
            });

            // Lines input
            document.getElementById('linesInput').addEventListener('input', function(e) {
                const value = parseInt(e.target.value);
                if (value && value > 0) {
                    currentLines = value;
                    debounceLoadLogs();
                }
            });

            // Filter buttons
            document.querySelectorAll('.filter-btn').forEach(btn => {
                btn.addEventListener('click', function() {
                    handleLevelFilter(this);
                });
            });

            // Close panel button
            document.getElementById('closePanelBtn').addEventListener('click', function() {
                closeDetailsPanel();
            });

            // Retry button
            document.getElementById('retryBtn').addEventListener('click', function() {
                hideErrorMessage();
                loadLogs();
            });

            // Table row clicks
            document.getElementById('logTableBody').addEventListener('click', function(e) {
                const row = e.target.closest('tr');
                if (row && row.dataset.logData) {
                    showLogDetails(JSON.parse(row.dataset.logData));
                }
            });
        }

        function toggleLogUpdates() {
            const btn = document.getElementById('toggleBtn');
            const icon = btn.querySelector('i');
            
            if (isRunning) {
                // Stop
                isRunning = false;
                if (refreshInterval) {
                    clearInterval(refreshInterval);
                }
                btn.className = 'btn btn-primary';
                btn.dataset.state = 'stopped';
                icon.className = 'fas fa-play';
                btn.innerHTML = '<i class="fas fa-play"></i> Start';
            } else {
                // Start
                isRunning = true;
                refreshInterval = setInterval(loadLogs, 2000);
                btn.className = 'btn btn-success';
                btn.dataset.state = 'running';
                icon.className = 'fas fa-stop';
                btn.innerHTML = '<i class="fas fa-stop"></i> Stop';
                loadLogs();
            }
        }

        function clearLogs() {
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = '';
            closeDetailsPanel();
            clearTimestamp = new Date().toISOString();
        }

        function handleLevelFilter(btn) {
            const level = btn.dataset.level;
            
            if (level === 'all') {
                selectedLevels = ['all'];
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            } else if (level === 'none') {
                selectedLevels = [];
                document.querySelectorAll('.filter-btn').forEach(b => b.classList.remove('active'));
                btn.classList.add('active');
            } else {
                // Remove 'all' and 'none' if they were selected
                selectedLevels = selectedLevels.filter(l => l !== 'all' && l !== 'none');
                document.getElementById('allBtn').classList.remove('active');
                document.getElementById('noneBtn').classList.remove('active');
                
                if (selectedLevels.includes(level)) {
                    selectedLevels = selectedLevels.filter(l => l !== level);
                    btn.classList.remove('active');
                } else {
                    selectedLevels.push(level);
                    btn.classList.add('active');
                }
            }
            
            // Save the filter state to cookies
            setCookie('logLevelFilters', selectedLevels);
            
            filterLogsByLevel();
        }

        function filterLogsByLevel() {
            const rows = document.querySelectorAll('#logTableBody tr');
            rows.forEach(row => {
                const logData = JSON.parse(row.dataset.logData);
                const level = logData.level;
                
                // Show if: 'all' is selected, OR no filters selected (same as all), OR specific level is selected
                if (selectedLevels.includes('all') || selectedLevels.length === 0 || selectedLevels.includes(level)) {
                    row.style.display = '';
                } else {
                    row.style.display = 'none';
                }
            });
        }

        let searchTimeout;
        function debounceSearch() {
            clearTimeout(searchTimeout);
            searchTimeout = setTimeout(loadLogs, 500);
        }
        
        let loadLogsTimeout;
        function debounceLoadLogs() {
            clearTimeout(loadLogsTimeout);
            loadLogsTimeout = setTimeout(loadLogs, 300);
        }

        function loadLogs() {
            const loading = document.getElementById('loading');
            hideErrorMessage();
            loading.style.display = 'block';
            
            let url = `/logs?lines=${currentLines}`;
            if (currentSearch) {
                url += `&search=${encodeURIComponent(currentSearch)}`;
            }
            
            fetch(url)
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    // Filter out logs that are older than the clear timestamp
                    let filteredData = data;
                    if (clearTimestamp) {
                        filteredData = data.filter(log => {
                            const logTime = new Date(log.timestamp);
                            const clearTime = new Date(clearTimestamp);
                            return logTime > clearTime;
                        });
                    }
                    
                    // Sort logs by timestamp (newest first)
                    filteredData.sort((a, b) => {
                        const timeA = new Date(a.timestamp);
                        const timeB = new Date(b.timestamp);
                        return timeB - timeA; // Newest first
                    });
                    
                    displayLogs(filteredData);
                    loading.style.display = 'none';
                })
                .catch(error => {
                    console.error('Error loading logs:', error);
                    loading.style.display = 'none';
                    showErrorMessage();
                });
        }

        function displayLogs(logs) {
            const tbody = document.getElementById('logTableBody');
            tbody.innerHTML = '';
            
            logs.forEach(log => {
                const row = document.createElement('tr');
                // Use the IsRecent field from the backend response
                row.className = log.is_recent ? 'recent' : '';
                row.dataset.logData = JSON.stringify(log);
                
                const timeCell = document.createElement('td');
                timeCell.className = 'col-time';
                timeCell.textContent = formatTime(log.timestamp);
                
                const levelCell = document.createElement('td');
                levelCell.className = 'col-level';
                levelCell.innerHTML = `<span class="level level-${log.level.toLowerCase()}">${log.level}</span>`;
                
                const codeCell = document.createElement('td');
                codeCell.className = 'col-code';
                codeCell.textContent = log.json_code || '';
                
                const messageCell = document.createElement('td');
                messageCell.className = 'col-message';
                messageCell.textContent = log.message || '';
                
                const fileCell = document.createElement('td');
                fileCell.className = 'col-file';
                fileCell.textContent = log.json_file || (log.source_file || '');
                
                row.appendChild(timeCell);
                row.appendChild(levelCell);
                row.appendChild(codeCell);
                row.appendChild(messageCell);
                row.appendChild(fileCell);
                
                tbody.appendChild(row);
            });
            
            filterLogsByLevel();
        }



        function formatTime(timestamp) {
            const logDate = new Date(timestamp);
            const today = new Date();
            
            const isToday = logDate.toDateString() === today.toDateString();
            
            if (isToday) {
                return logDate.toLocaleTimeString();
            } else {
                const dateStr = logDate.toLocaleDateString();
                const timeStr = logDate.toLocaleTimeString();
                return `${timeStr} (${dateStr})`;
            }
        }

        function showLogDetails(log) {
            const panel = document.getElementById('detailsPanel');
            const content = document.getElementById('detailsContent');
            
            let html = `
                <div class="detail-section">
                    <h4>Basic Information</h4>
                    <div class="detail-grid">
                        <div class="detail-item">
                            <label>Timestamp:</label>
                            <span>${log.timestamp}</span>
                        </div>
                        <div class="detail-item">
                            <label>Level:</label>
                            <span class="level level-${log.level.toLowerCase()}">${log.level}</span>
                        </div>
                        <div class="detail-item">
                            <label>Message:</label>
                            <span>${log.message || 'N/A'}</span>
                        </div>
                        ${log.json_code ? `
                        <div class="detail-item">
                            <label>Code:</label>
                            <span>${log.json_code}</span>
                        </div>` : ''}
                        ${log.source_file ? `
                        <div class="detail-item">
                            <label>Source File:</label>
                            <span>${log.source_file}</span>
                        </div>` : ''}
                    </div>
                </div>
            `;
            
            if (log.json_file || log.json_line || log.json_class || log.json_function) {
                html += `
                    <div class="detail-section">
                        <h4>Code Location</h4>
                        <div class="detail-grid">
                            ${log.json_file ? `
                            <div class="detail-item">
                                <label>File:</label>
                                <span>${log.json_file}</span>
                            </div>` : ''}
                            ${log.json_line ? `
                            <div class="detail-item">
                                <label>Line:</label>
                                <span>${log.json_line}</span>
                            </div>` : ''}
                            ${log.json_class ? `
                            <div class="detail-item">
                                <label>Class:</label>
                                <span>${log.json_class}</span>
                            </div>` : ''}
                            ${log.json_function ? `
                            <div class="detail-item">
                                <label>Function:</label>
                                <span>${log.json_function}</span>
                            </div>` : ''}
                        </div>
                    </div>
                `;
            }
            
            if (log.json_request_uri || log.json_correlation_id) {
                html += `
                    <div class="detail-section">
                        <h4>Request Information</h4>
                        <div class="detail-grid">
                            ${log.json_request_uri ? `
                            <div class="detail-item">
                                <label>Request URI:</label>
                                <span>${log.json_request_uri}</span>
                            </div>` : ''}
                            ${log.json_correlation_id ? `
                            <div class="detail-item">
                                <label>Correlation ID:</label>
                                <span>${log.json_correlation_id}</span>
                            </div>` : ''}
                        </div>
                    </div>
                `;
            }
            
            if (log.json_exception || log.json_exceptionMessage) {
                html += `
                    <div class="detail-section">
                        <h4>Exception Details</h4>
                        <div class="detail-grid">
                            ${log.json_exceptionMessage ? `
                            <div class="detail-item">
                                <label>Exception Message:</label>
                                <span class="exception-text">${log.json_exceptionMessage}</span>
                            </div>` : ''}
                            ${log.json_exception ? `
                            <div class="detail-item">
                                <label>Exception:</label>
                                <span class="exception-text">${log.json_exception}</span>
                            </div>` : ''}
                        </div>
                    </div>
                `;
            }
            
            if (log.json_part) {
                html += `
                    <div class="detail-section">
                        <h4>Raw JSON</h4>
                        <pre class="json-content">${log.json_part}</pre>
                    </div>
                `;
            }
            
            content.innerHTML = html;
            panel.classList.add('open');
        }

        function closeDetailsPanel() {
            const panel = document.getElementById('detailsPanel');
            panel.classList.remove('open');
        }

        function showErrorMessage() {
            const errorMsg = document.getElementById('errorMessage');
            errorMsg.style.display = 'block';
        }

        function hideErrorMessage() {
            const errorMsg = document.getElementById('errorMessage');
            errorMsg.style.display = 'none';
        }
        
        // Load log source information
        function loadLogSource() {
            fetch('/info')
                .then(response => {
                    if (!response.ok) {
                        throw new Error(`HTTP ${response.status}: ${response.statusText}`);
                    }
                    return response.json();
                })
                .then(data => {
                    const logSourceElement = document.getElementById('logSource');
                    if (data.is_directory) {
                        logSourceElement.textContent = `(${data.path} - ${data.file_count} files)`;
                    } else {
                        logSourceElement.textContent = `(${data.path})`;
                    }
                })
                .catch(error => {
                    console.error('Error loading log source:', error);
                    document.getElementById('logSource').textContent = '(Service unavailable)';
                });
        }
    </script>
    </div>
</body>
</html>
